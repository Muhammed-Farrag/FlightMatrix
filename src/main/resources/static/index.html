<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <title>FlightMatrix — Login</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-card {
      background:var(--surface-container-low);
      border:1px solid var(--outline-variant);
      border-radius:24px;
      padding:48px 44px;
      width:100%;
      max-width:420px;
    }
    .auth-brand {
      display:flex; align-items:center; gap:10px;
      font-family:'Plus Jakarta Sans',sans-serif;
      font-size:22px; font-weight:800;
      color:var(--primary); margin-bottom:32px;
    }
    .auth-logo {
      width:28px;
      height:28px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .auth-logo img {
      width:22px;
      height:22px;
      display:block;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-logo"><img src="/assets/logo.svg" alt="FlightMatrix logo"></span>FlightMatrix
    </div>
    <div style="margin-bottom:28px;">
      <div style="font-size:20px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;">Welcome back</div>
      <div style="font-size:13px;color:var(--on-surface-variant);margin-top:4px;">Sign in to your account</div>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input id="username" type="text" class="input-sky" placeholder="Enter username" required>
      </div>
      <div class="form-group" style="margin-top:18px;">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="input-sky" placeholder="Enter password" required>
      </div>
      <button id="login-btn" type="submit" class="cloud-btn" style="width:100%;margin-top:28px;">
        Sign In
      </button>
    </form>

    <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--on-surface-variant);">
      Don't have an account?
      <a href="/register.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Register</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/lucide.min.js"></script>
  <script>
    lucide.createIcons();

    (async () => {
      const user = await getCurrentUser();
      if (user) redirectByRole(user.role);
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      setLoading(btn, true, 'Sign In');
      const res = await login(
        document.getElementById('username').value,
        document.getElementById('password').value
      );
      setLoading(btn, false, 'Sign In');
      if (res && res.success) {
        redirectByRole(res.data.role);
      } else {
        showToast(res?.message || 'Invalid credentials');
      }
    });
  </script>
</body>
</html>
