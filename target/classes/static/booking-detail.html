<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <title>FlightMatrix — Booking Detail</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <style>
    .detail-block {
      background:var(--surface-container-low);
      border:1px solid var(--outline-variant);
      border-radius:20px; padding:24px; margin-bottom:20px;
    }
    .detail-block h3 { font-size:14px;font-weight:600;margin-bottom:16px; }
    .detail-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--outline-variant); }
    .detail-row:last-child { border-bottom:none; }
    .detail-label { font-size:13px;color:var(--on-surface-variant); }
    .detail-value { font-size:13px;font-weight:500; }
  </style>
</head>
<body>
  <nav id="navbar" class="navbar"></nav>
  <div class="page-content">
    <div class="container" style="max-width:760px;">

      <div style="margin-bottom:24px;">
        <a href="/booking-list.html" style="font-size:13px;color:var(--on-surface-variant);text-decoration:none;">← Back to Bookings</a>
        <div style="display:flex;align-items:center;gap:16px;margin-top:8px;">
          <div style="font-size:24px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;" id="page-title">Booking Detail</div>
          <div id="status-chip"></div>
        </div>
      </div>

      <div id="booking-content">
        <div style="text-align:center;padding:60px;"><span class="spinner"></span></div>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/booking.js"></script>
  <script src="/js/payment.js"></script>
  <script src="/js/flights.js"></script>
  <script src="/js/lucide.min.js"></script>
  <script>
    let _booking = null;

    async function cancelMyBooking() {
      if (!confirm('Cancel this booking? This cannot be undone.')) return;
      const btn = document.getElementById('cancel-btn');
      setLoading(btn, true, 'Cancel Booking');
      const res = await cancelBooking(_booking.bookingReference);
      setLoading(btn, false, 'Cancel Booking');
      if (res && res.success) { showToast('Booking cancelled', 'success'); await loadBooking(); }
      else showToast(res?.message || 'Cancel failed');
    }

    async function loadBooking() {
      const ref = getParam('ref');
      if (!ref) { showToast('No booking reference'); return; }

      const res = await getBooking(ref);
      if (!res || !res.success) {
        document.getElementById('booking-content').innerHTML =
          '<div class="empty-state"><h3>Booking not found</h3></div>';
        lucide.createIcons(); return;
      }
      _booking = res.data;
      const b   = _booking;
      const f   = b.flight || {};

      document.getElementById('page-title').textContent = `PNR: ${b.bookingReference}`;
      document.getElementById('status-chip').innerHTML  = statusChip(b.status);

      const canPay    = b.status !== 'CANCELLED' && b.paymentStatus !== 'PAID';
      const canCancel = b.status === 'CONFIRMED' || b.status === 'RESERVED';

      document.getElementById('booking-content').innerHTML = `
        <div class="detail-block">
          <h3>Flight Information</h3>
          ${renderFlightCard(f, false)}
        </div>

        <div class="detail-block">
          <h3>Booking Details</h3>
          <div class="detail-row">
            <span class="detail-label">Booking Reference</span>
            <span class="data-mono detail-value" style="color:var(--primary);">${b.bookingReference}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Seat Class</span>
            <span class="detail-value">${b.seatClass || '—'}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Total Price</span>
            <span class="data-mono detail-value">$${(b.totalPrice||0).toFixed(2)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Booking Status</span>
            <span class="detail-value">${statusChip(b.status)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Payment Status</span>
            <span class="detail-value">${payChip(b.paymentStatus || 'PENDING')}</span>
          </div>
        </div>

        <div class="detail-block">
          <h3>Passengers (${(b.passengers||[]).length})</h3>
          ${(b.passengers||[]).map((p,i) => `
            <div class="detail-row">
              <span class="detail-label">${i+1}. ${p.name}</span>
              <span class="data-mono detail-value" style="font-size:12px;">${p.passportNumber||'—'}</span>
            </div>`).join('')}
        </div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          ${canPay ? `<a href="/payment.html?ref=${b.bookingReference}" class="cloud-btn" style="text-decoration:none;">
            <i data-lucide="credit-card" style="width:15px;height:15px;"></i> Pay Now
          </a>` : ''}
          ${b.status === 'CONFIRMED' && b.paymentStatus === 'PAID' ? `
            <a href="/eticket.html?ref=${b.bookingReference}" class="cloud-btn-outline" style="text-decoration:none;">
              <i data-lucide="ticket" style="width:15px;height:15px;"></i> View E-Ticket
            </a>` : ''}
          ${canCancel ? `<button id="cancel-btn" class="cloud-btn-outline" onclick="cancelMyBooking()"
            style="color:var(--error);border-color:var(--error);">
            <i data-lucide="x-circle" style="width:15px;height:15px;"></i> Cancel Booking
          </button>` : ''}
        </div>
      `;
      lucide.createIcons();
    }

    (async () => {
      await requireAuth();
      await initNavbar('bookings');
      await loadBooking();
    })();
  </script>
</body>
</html>
